# Local development: `docker compose up -d db minio`, then `npm run dev`.
# College servers: `docker compose --profile full up -d` runs everything (set real secrets in .env first).
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: vividh
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-vividh}
      POSTGRES_DB: vividh
    ports: ["5432:5432"]
    volumes: [db:/var/lib/postgresql/data]
    restart: unless-stopped

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-vividh}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-vividh-secret}
    ports: ["9000:9000", "9001:9001"]
    volumes: [media:/data]
    restart: unless-stopped

  # Creates the bucket once.
  minio-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    depends_on: [minio]
    entrypoint: >
      sh -c "until mc alias set local http://minio:9000 $${S3_ACCESS_KEY:-vividh} $${S3_SECRET_KEY:-vividh-secret}; do sleep 1; done;
             mc mb --ignore-existing local/vividh-media"
    environment:
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-vividh}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-vividh-secret}

  # Applies database migrations, then exits. Runs before the app on every `docker compose --profile full up`.
  migrate:
    build: { context: ., target: build }
    profiles: [full]
    command: npx prisma migrate deploy
    environment:
      DATABASE_URL: postgresql://vividh:${POSTGRES_PASSWORD:-vividh}@db:5432/vividh
    depends_on: [db]

  app:
    build: .
    profiles: [full]
    env_file: .env
    environment:
      DATABASE_URL: postgresql://vividh:${POSTGRES_PASSWORD:-vividh}@db:5432/vividh
      S3_ENDPOINT: http://minio:9000
      S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT:-http://localhost:9000}
    ports: ["3000:3000"]
    depends_on:
      migrate: { condition: service_completed_successfully }
      minio-init: { condition: service_completed_successfully }
    restart: unless-stopped

volumes:
  db:
  media:
